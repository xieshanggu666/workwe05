<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭营养膳食规划系统</title>
<style>
  :root {
    --bg: #f3f7f2;
    --panel: #ffffff;
    --ink: #23332a;
    --muted: #6b7d70;
    --line: #e2eadf;
    --brand: #2e8b57;
    --brand-dark: #1f6e43;
    --brand-soft: #e6f2ea;
    --accent: #d98e2b;
    --bad: #c0392b;
    --good: #2e8b57;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { display: flex; min-height: 100vh; }
  /* ---------- sidebar ---------- */
  .side {
    width: 300px; flex: 0 0 300px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 18px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .side h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .side h1 .leaf { width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); display: inline-flex; align-items: center; justify-content: center; }
  .side .sub { font-size: 12px; color: var(--muted); margin: 6px 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #3c4f43; }
  .field select, .field input[type="number"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 9px; font-size: 14px; background: #fbfdfb; color: var(--ink); outline: none;
  }
  .field select:focus, .field input:focus { border-color: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); cursor: pointer; user-select: none; background: #fbfdfb;
    transition: all .15s;
  }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .budget-row { display: flex; align-items: center; gap: 10px; }
  .budget-row input[type="range"] { flex: 1; accent-color: var(--brand); }
  .budget-val { min-width: 56px; font-weight: 700; color: var(--brand-dark); font-size: 14px; text-align: right; }
  .tabs { display: flex; gap: 6px; margin: 16px 0 12px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--line); cursor: pointer; background: #fbfdfb; font-weight: 600;
  }
  .tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .go {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(46,139,87,.28);
  }
  .go:hover { filter: brightness(1.06); }
  .side .hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  /* ---------- main ---------- */
  .main { flex: 1; padding: 26px 30px; max-width: 1180px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .topbar h2 { font-size: 22px; }
  .topbar .meta { font-size: 13px; color: var(--muted); }
  .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }
  .banner.bad { background: #fdecea; color: var(--bad); border: 1px solid #f5c6c0; }
  .banner.good { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #c3e2d1; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }
  .meal-card { background: var(--panel); border-radius: var(--radius); border: 1px solid var(--line); padding: 16px; }
  .meal-card h3 { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .meal-card h3 .cost { font-size: 13px; color: var(--brand-dark); font-weight: 700; }
  .meal-card ul { list-style: none; }
  .meal-card li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .meal-card li:last-child { border-bottom: none; }
  .meal-card li .g { color: var(--muted); font-size: 12px; }
  .role-tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-dark); margin-right: 8px; white-space: nowrap; }
  /* summary panel */
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .summary h3 { font-size: 15px; margin-bottom: 14px; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { flex: 1; min-width: 150px; background: #fbfdfb; border: 1px solid var(--line); border-radius: 11px; padding: 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 800; margin: 4px 0; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .bar { height: 8px; border-radius: 6px; background: #e9efe9; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: var(--brand); }
  .macro { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 10px 0 6px; }
  .macro i { display: block; height: 100%; }
  .macro-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  .macro-legend b { color: var(--ink); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .adequacy { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .adq { background: #fbfdfb; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .adq .top { display: flex; justify-content: space-between; font-size: 12px; }
  .adq .top b { font-size: 13px; }
  .adq .pct { font-size: 12px; font-weight: 700; }
  .adq .bar { height: 6px; margin-top: 5px; }
  .pct.good { color: var(--good); } .pct.warn { color: var(--accent); } .pct.bad { color: var(--bad); }
  /* week view */
  .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .day-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .day-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .day-card .head h3 { font-size: 15px; }
  .day-card .head .cost { font-size: 12px; color: var(--brand-dark); font-weight: 700; }
  .day-card .kcal { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .day-card ul { list-style: none; }
  .day-card li { font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; }
  .day-card li:last-child { border-bottom: none; }
  .day-card .meal-sep { font-size: 11px; color: var(--brand-dark); font-weight: 700; margin: 8px 0 2px; }
  .diversity { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .div-item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; text-align: center; }
  .div-item .d { font-size: 20px; font-weight: 800; color: var(--brand-dark); }
  .div-item .k { font-size: 12px; color: var(--muted); }
  /* household: procurement & inventory */
  .hh-section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .hh-section > h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .hh-section > h3 .count { font-size: 12px; color: var(--muted); font-weight: 400; }
  .hh-budget { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .b-card { background: #fbfdfb; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
  .b-card .k { font-size: 12px; color: var(--muted); }
  .b-card .v { font-size: 19px; font-weight: 800; margin-top: 3px; }
  .b-card .v.bad { color: var(--bad); }
  .b-card .v.good { color: var(--brand-dark); }
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .member-card { background: #fbfdfb; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; position: relative; }
  .member-card .nm { font-weight: 700; font-size: 14px; }
  .member-card .pf { font-size: 12px; color: var(--muted); margin: 3px 0 6px; }
  .member-card .ag { display: flex; flex-wrap: wrap; gap: 4px; }
  .mini-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #fdecea; color: var(--bad); border: 1px solid #f5c6c0; }
  .mini-tag.ok { background: var(--brand-soft); color: var(--brand-dark); border-color: #c3e2d1; }
  .icon-btn { border: 1px solid var(--line); background: #fbfdfb; border-radius: 8px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand-dark); }
  .icon-btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .member-card .ops { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
  .hh-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .btn { border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 9px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: #fbfdfb; color: var(--brand-dark); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.warn { border-color: var(--accent); background: var(--accent); }
  table.hh-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.hh-table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.hh-table td { padding: 8px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
  table.hh-table tr:last-child td { border-bottom: none; }
  .status-pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .status-pill.pending { background: #fdf3e3; color: #a86a1c; border: 1px solid #f0d8ae; }
  .status-pill.arrived { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #c3e2d1; }
  select.mini, input.mini { border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; font-size: 12px; background: #fbfdfb; color: var(--ink); }
  .warn-list { display: flex; flex-direction: column; gap: 8px; }
  .warn-item { padding: 9px 13px; border-radius: 10px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
  .warn-item.danger { background: #fdecea; color: var(--bad); border: 1px solid #f5c6c0; }
  .warn-item.warn { background: #fdf3e3; color: #8a5a16; border: 1px solid #f0d8ae; }
  .day-consume { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fbfdfb; margin-bottom: 8px; font-size: 13px; }
  .day-consume.done { background: var(--brand-soft); border-color: #c3e2d1; }
  .day-consume .info b { font-size: 13px; }
  .day-consume .info span { color: var(--muted); font-size: 12px; margin-left: 8px; }
  /* meal collaboration */
  .stage-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .stage-step { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; opacity: .62; }
  .stage-step.done { opacity: 1; border-color: #c3e2d1; background: var(--brand-soft); }
  .stage-step.cur { opacity: 1; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(46,139,87,.15); }
  .stage-step .n { font-size: 12px; color: var(--muted); }
  .stage-step .t { font-size: 15px; font-weight: 700; margin: 2px 0; }
  .stage-step .c { font-size: 12px; color: var(--brand-dark); }
  .role-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; margin-left: 4px; }
  .role-badge.parent { background: #e7f0fb; color: #2a629a; border: 1px solid #c4dcf2; }
  .role-badge.buyer { background: #fdf3e3; color: #a86a1c; border: 1px solid #f0d8ae; }
  .portion-row { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 8px; align-items: center; padding: 7px 8px; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .portion-row.head { font-weight: 700; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  .portion-cell { display: flex; align-items: center; gap: 6px; }
  .portion-cell input { width: 64px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px; font-size: 12px; }
  .kcal-pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 700; }
  .kcal-pill.good { background: var(--brand-soft); color: var(--brand-dark); }
  .kcal-pill.warn { background: #fdf3e3; color: #a86a1c; }
  .sub-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .sub-tag.ok { background: #edf4ee; color: var(--brand-dark); }
  .sub-tag.replaced { background: #eef0fb; color: #4154b5; }
  .sub-tag.pending { background: #f3f3f3; color: var(--muted); }
  .trace-line { font-size: 11.5px; color: var(--muted); padding: 3px 0; border-bottom: 1px dotted var(--line); }
  .trace-line b { color: var(--ink); }
  .audit-box { max-height: 240px; overflow-y: auto; font-size: 12px; }
  .audit-item { padding: 5px 0; border-bottom: 1px dotted var(--line); color: #43544a; }
  .audit-item .at { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .member-nutr { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .mn-card { background: #fbfdfb; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
  .mn-card .h { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .mini-adq { display: flex; gap: 3px; margin-top: 5px; }
  .mini-adq i { height: 6px; flex: 1; border-radius: 3px; background: #e3eae3; display: block; }
  .mini-adq i.on { background: var(--brand); }
  .mini-adq i.warn { background: var(--accent); }
  /* modal */
  .modal-mask { position: fixed; inset: 0; background: rgba(30,45,36,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--panel); border-radius: 14px; width: min(460px, 92vw); padding: 20px 22px; box-shadow: 0 18px 50px rgba(0,0,0,.2); }
  .modal h3 { font-size: 16px; margin-bottom: 14px; }
  .modal .field { margin-bottom: 12px; }
  .modal .ops { display: flex; justify-content: flex-end; gap: 9px; margin-top: 16px; }
  .modal .cancel { border: 1px solid var(--line); background: #fbfdfb; color: var(--muted); }
  .hide { display: none; }
  @media (max-width: 900px) {
    .wrap { flex-direction: column; }
    .side { width: 100%; height: auto; position: static; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1><span class="leaf">🌿</span>家庭营养膳食规划</h1>
    <div class="sub">基于膳食参考摄入量与多维约束的每日 / 每周配餐</div>

    <div class="tabs">
      <div class="tab on" data-mode="day">单日配餐</div>
      <div class="tab" data-mode="week">周菜单</div>
      <div class="tab" data-mode="meal">分餐协作</div>
      <div class="tab" data-mode="household">采购与库存</div>
    </div>

    <div id="plan_inputs">
    <div class="field">
      <label>家庭成员（单人参考画像）</label>
      <select id="age_group"></select>
    </div>
    <div class="field">
      <label>活动水平</label>
      <select id="activity"></select>
    </div>
    <div class="field">
      <label>膳食目标</label>
      <select id="goal"></select>
    </div>
    <div class="field">
      <label>每日预算（元）</label>
      <div class="budget-row">
        <input type="range" id="budget" min="10" max="60" value="25" step="1">
        <span class="budget-val" id="budget_val">25 元</span>
      </div>
    </div>
    <div class="field">
      <label>需规避的过敏原（采购视图下自动并入全家清单）</label>
      <div class="chips" id="allergens"></div>
    </div>
    <div class="field">
      <label>排除食材</label>
      <select id="exclude" multiple size="6"></select>
    </div>
    </div>
    <button class="go" id="go">生 成 方 案</button>
    <div class="hint" id="plan_hint">按膳食参考摄入量计算营养目标，求解热量区间、宏量营养素供能比、微量营养素达标与预算等多维约束，并保证一周内食材轮换与蛋白质来源多样化。在「采购与库存」页可维护全家成员、生成分工采购清单、确认到货与按配餐消耗，库存会自动抵扣预算并驱动后续配餐。</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="view_title">单日膳食方案</h2>
      <div class="meta" id="view_meta"></div>
    </div>
    <div id="banner"></div>

    <div id="day_view">
      <div class="grid" id="meals"></div>
      <div class="summary" id="day_summary"></div>
    </div>

    <div id="week_view" class="hide">
      <div class="hh-toolbar" id="week_toolbar">
        <button class="btn" id="to_household">🛒 据此生成分工采购清单</button>
      </div>
      <div class="diversity" id="diversity"></div>
      <div class="week-grid" id="week_grid"></div>
    </div>

    <div id="meal_view" class="hide">
      <div id="meal_actor_bar"></div>
      <div id="meal_body"></div>
    </div>

    <div id="household_view" class="hide">
      <div id="hh_warn"></div>

      <div class="hh-section">
        <h3>💰 本周预算 <span class="count" id="hh_cycle_label"></span></h3>
        <div class="hh-budget" id="hh_budget"></div>
        <div class="hh-toolbar" style="margin:12px 0 0">
          <button class="btn ghost" id="hh_edit_budget">调整周预算</button>
          <button class="btn ghost" id="hh_new_cycle">开启新一周（库存结转）</button>
        </div>
      </div>

      <div class="hh-section">
        <h3>👨‍👩‍👧 家庭成员与过敏原 <span class="count" id="hh_family_sub"></span></h3>
        <div class="member-grid" id="hh_members"></div>
        <div class="hh-toolbar" style="margin:12px 0 0">
          <button class="btn" id="hh_add_member">＋ 添加成员</button>
        </div>
      </div>

      <div class="hh-section">
        <h3>📋 周菜单分工采购 <span class="count" id="hh_shop_sub"></span></h3>
        <div class="hh-toolbar">
          <button class="btn" id="hh_build">🔄 按周菜单生成 / 刷新采购清单</button>
          <button class="btn ghost" id="hh_add_item">＋ 手动添加采购项</button>
        </div>
        <div id="hh_shop_table"></div>
      </div>

      <div class="hh-section">
        <h3>🍱 按配餐确认消耗 <span class="count">到货齐全后逐日确认，自动扣库存并累计周限次</span></h3>
        <div id="hh_days"></div>
      </div>

      <div class="hh-section">
        <h3>🧺 家庭库存 <span class="count" id="hh_stock_sub"></span></h3>
        <div class="hh-toolbar">
          <button class="btn ghost" id="hh_add_stock">期初 / 盘库录入</button>
        </div>
        <div id="hh_stock_table"></div>
      </div>
    </div>
  </main>
</div>
<div id="modal_root"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const meta = { profiles: {}, activities: {}, goals: {}, allergens: [], nutrient_labels: {}, nutrient_order: [] };
const state = { mode: "day", plan: null, week: null, params: null, household: null, actorId: null };

function initMeta(m) {
  meta.profiles = m.profiles; meta.activities = m.activities; meta.goals = m.goals;
  meta.allergens = m.allergens; meta.nutrient_labels = m.nutrient_labels;
  meta.nutrient_order = m.nutrient_order;
  const sel = (id, map) => {
    const el = $(id);
    el.innerHTML = Object.entries(map).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
    return el;
  };
  sel("#age_group", m.profiles);
  sel("#activity", m.activities);
  sel("#goal", m.goals);
  $("#allergens").innerHTML = m.allergens.map(a => `<span class="chip" data-a="${a}">${a}</span>`).join("");
  document.querySelectorAll("#allergens .chip").forEach(c => {
    c.onclick = () => c.classList.toggle("on");
  });
}

async function loadFoods() {
  const r = await fetch("/api/foods");
  const d = await r.json();
  $("#exclude").innerHTML = d.foods.map(f => `<option value="${f.id}">${f.name}</option>`).join("");
}

function collectParams() {
  const allergens = [...document.querySelectorAll("#allergens .chip.on")].map(c => c.dataset.a);
  const exclude = [...$("#exclude").selectedOptions].map(o => o.value);
  return {
    profile: {
      age_group: $("#age_group").value,
      activity: $("#activity").value,
      goal: $("#goal").value,
    },
    budget: Number($("#budget").value),
    allergens,
    exclude,
  };
}

async function api(path, method = "GET", body) {
  const opt = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const d = await r.json();
  if (!r.ok) throw Object.assign(new Error(d.error || "请求失败"), { data: d });
  return d;
}

/* 配餐与家庭库存联动：过敏原取全家并集，库存优先抵扣，周限次累计 */
function paramsWithHousehold(params) {
  const h = state.household;
  if (!h || h.state.members.length === 0) return params;
  const merged = {
    ...params,
    allergens: [...new Set([...(params.allergens || []), ...(h.family_allergens || [])])],
  };
  if (state.mode === "week" || state.mode === "day") {
    merged.stock = h.sync.stock;
    merged.weekly_used = h.sync.weekly_used;
  }
  return merged;
}

function roleLabel(role) {
  return { staple: "主食", protein: "主菜", dairy_egg: "蛋奶", veg_a: "蔬菜", veg_b: "蔬菜", oil: "油脂", fruit: "水果", nut: "坚果" }[role] || role;
}

function renderDay(r, req) {
  const meals = { breakfast: [], lunch: [], dinner: [] };
  r.items.forEach(it => {
    (meals[it.meal] = meals[it.meal] || []).push(it);
  });
  const mealNames = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };
  $("#meals").innerHTML = ["breakfast", "lunch", "dinner"].map(m => `
    <div class="meal-card">
      <h3>${mealNames[m]}<span class="cost">¥${meals[m].reduce((s, i) => s + i.cost, 0).toFixed(1)}</span></h3>
      <ul>${meals[m].map(i => `
        <li><span><span class="role-tag">${roleLabel(i.role)}</span>${i.name}</span>
        <span class="g">${i.grams}g · ¥${i.cost.toFixed(1)}</span></li>`).join("")}
      </ul>
    </div>`).join("");

  const t = r.totals;
  const rr = r.ratios;
  const reqKcal = req.kcal;
  const kcalPct = Math.min(100, Math.round(t.kcal / reqKcal * 100));
  const pctCls = p => p >= 80 && p <= 120 ? "good" : (p >= 60 ? "warn" : "bad");
  const adq = r.adequacy;
  const order = meta.nutrient_order.filter(n => adq[n]);
  $("#day_summary").innerHTML = `
    <h3>营养汇总 · 菜单成本 ¥${t.cost.toFixed(1)}${r.purchase_cost != null && r.purchase_cost !== t.cost ? ` · 净采购 ¥${r.purchase_cost.toFixed(1)}（库存抵扣 ¥${(r.stock_used || 0).toFixed(1)}）` : ""}</h3>
    <div class="stat-row">
      <div class="stat"><div class="k">热量 / 目标</div>
        <div class="v">${Math.round(t.kcal)}<small> / ${reqKcal} kcal</small></div>
        <div class="bar"><i style="width:${kcalPct}%"></i></div></div>
      <div class="stat"><div class="k">蛋白质</div><div class="v">${t.protein.toFixed(1)}<small>g</small></div></div>
      <div class="stat"><div class="k">脂肪</div><div class="v">${t.fat.toFixed(1)}<small>g</small></div></div>
      <div class="stat"><div class="k">碳水</div><div class="v">${t.carb.toFixed(1)}<small>g</small></div></div>
      <div class="stat"><div class="k">膳食纤维</div><div class="v">${t.fiber.toFixed(1)}<small>g / ≥${req.fiber}g</small></div></div>
    </div>
    <div style="font-size:13px;font-weight:600;margin-top:8px">宏量营养素供能比</div>
    <div class="macro">
      <i style="width:${(rr.fat * 100).toFixed(1)}%;background:#d98e2b"></i>
      <i style="width:${(rr.protein * 100).toFixed(1)}%;background:#2e8b57"></i>
      <i style="width:${(rr.carb * 100).toFixed(1)}%;background:#5b8db8"></i>
    </div>
    <div class="macro-legend">
      <span><span class="legend-dot" style="background:#d98e2b"></span>脂肪 <b>${(rr.fat * 100).toFixed(1)}%</b>（目标 20-30%）</span>
      <span><span class="legend-dot" style="background:#2e8b57"></span>蛋白质 <b>${(rr.protein * 100).toFixed(1)}%</b>（目标 10-20%）</span>
      <span><span class="legend-dot" style="background:#5b8db8"></span>碳水 <b>${(rr.carb * 100).toFixed(1)}%</b>（目标 50-65%）</span>
    </div>
    <h3 style="margin-top:16px">微量营养素达标度</h3>
    <div class="adequacy">${order.map(n => {
      const a = adq[n];
      const label = meta.nutrient_labels[n] || n;
      if (n === "sodium") {
        const p = Math.round(a.pct);
        return `<div class="adq"><div class="top"><span>${label}</span><span class="pct ${p > 100 ? 'warn' : 'good'}">${p}%</span></div>
          <div class="bar"><i style="width:${Math.min(100, p)}%;${p > 100 ? 'background:#d98e2b' : ''}"></i></div>
          <div style="font-size:11px;color:#6b7d70">${a.value}mg / 上限${a.max}mg</div></div>`;
      }
      const p = Math.round(a.pct);
      return `<div class="adq"><div class="top"><span>${label}</span><span class="pct ${pctCls(p)}">${p}%</span></div>
        <div class="bar"><i style="width:${Math.min(100, p)}%"></i></div>
        <div style="font-size:11px;color:#6b7d70">${a.value} / 目标${a.target}</div></div>`;
    }).join("")}</div>`;
}

function renderDayMeta(r, req) {
  $("#view_title").textContent = "单日膳食方案";
  $("#view_meta").textContent = `${req.profile_label} · 活动水平 ${meta.activities[state.params.profile.activity]} · ${meta.goals[state.params.profile.goal]} · 预算 ¥${state.params.budget}/日`;
  const banner = $("#banner");
  if (r.feasible) {
    banner.className = "banner good";
    banner.textContent = "方案已生成，满足热量、宏量营养素供能比与预算约束。";
  } else {
    banner.className = "banner bad";
    banner.textContent = "当前参数下无法生成完全满足约束的方案：" + (r.reasons && r.reasons.length ? r.reasons.join("；") : "约束过紧");
  }
}

const weekMetaOrder = ["kcal", "protein", "fat", "carb", "fiber"];

function renderWeek(w, req) {
  $("#view_title").textContent = "一周膳食菜单";
  $("#view_meta").textContent = `${req.profile_label} · 全周 ${w.days.length} 天 · 周菜单成本 ¥${w.weekly_cost.toFixed(1)}${w.weekly_purchase_cost != null && w.weekly_purchase_cost !== w.weekly_cost ? ` · 库存抵扣后净采购 ¥${w.weekly_purchase_cost.toFixed(1)}` : ""}`;
  const d = w.diversity;
  $("#diversity").innerHTML = `
    <div class="div-item"><div class="d">${d.unique_foods}</div><div class="k">全周不重复食材</div></div>
    <div class="div-item"><div class="d">${d.protein_kinds}/${d.protein_kinds_max}</div><div class="k">蛋白质来源类别</div></div>
    <div class="div-item"><div class="d">${d.liver_count}</div><div class="k">肝脏类次数</div></div>
    <div class="div-item"><div class="d">${d.repeat_servings}</div><div class="k">跨天复用份次</div></div>
    <div class="div-item"><div class="d">¥${w.weekly_cost.toFixed(1)}</div><div class="k">菜单总成本</div></div>
    ${w.weekly_purchase_cost != null ? `<div class="div-item"><div class="d">¥${w.weekly_purchase_cost.toFixed(1)}</div><div class="k">库存抵扣后净采购</div></div>` : ""}`;
  const meals = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };
  $("#week_grid").innerHTML = w.days.map(day => `
    <div class="day-card">
      <div class="head"><h3>${day.day_name}</h3><span class="cost">¥${day.cost.toFixed(1)}${day.purchase_cost != null && day.purchase_cost !== day.cost ? ` / 采购¥${day.purchase_cost.toFixed(1)}` : ""}</span></div>
      <div class="kcal">${Math.round(day.totals.kcal)} kcal · 蛋白 ${day.totals.protein.toFixed(1)}g / 脂肪 ${day.totals.fat.toFixed(1)}g / 碳水 ${day.totals.carb.toFixed(1)}g</div>
      ${["breakfast", "lunch", "dinner"].map(m => {
        const its = day.items.filter(i => i.meal === m);
        if (!its.length) return "";
        return `<div class="meal-sep">${meals[m]}</div><ul>${its.map(i => `
          <li><span>${i.name}</span><span>${i.grams}g</span></li>`).join("")}</ul>`;
      }).join("")}
    </div>`).join("");
  const banner = $("#banner");
  if (w.feasible) {
    banner.className = "banner good";
    banner.textContent = `周菜单生成完毕：相邻两天不重复食材，午餐蛋白质类别逐日轮换，肝脏类每周至多 1 次。${w.weekly_purchase_cost != null && w.weekly_purchase_cost < w.weekly_cost ? "库存已优先抵扣，净采购额见上。" : "可在下方生成分工采购清单。"}`;
  } else {
    banner.className = "banner bad";
    banner.textContent = "部分天数约束未完全满足，请调整参数。";
  }
}

async function generate() {
  $("#go").disabled = true;
  const params = paramsWithHousehold(collectParams());
  state.params = params;
  try {
    if (state.mode === "day") {
      const d = await api("/api/plan", "POST", params);
      state.plan = d;
      renderDayMeta(d, d.requirement);
      renderDay(d, d.requirement);
    } else {
      const d = await api("/api/week", "POST", params);
      state.week = d;
      renderWeek(d, d.requirement);
    }
  } catch (e) {
    const banner = $("#banner");
    banner.className = "banner bad";
    banner.textContent = "生成失败：" + e.message;
  } finally {
    $("#go").disabled = false;
  }
}

function switchMode(mode) {
  state.mode = mode;
  $$(".tab").forEach(x => x.classList.toggle("on", x.dataset.mode === mode));
  $("#day_view").classList.toggle("hide", mode !== "day");
  $("#week_view").classList.toggle("hide", mode !== "week");
  $("#meal_view").classList.toggle("hide", mode !== "meal");
  $("#household_view").classList.toggle("hide", mode !== "household");
  $("#plan_inputs").classList.toggle("hide", mode === "household" || mode === "meal");
  $("#go").classList.toggle("hide", mode === "household" || mode === "meal");
  if (mode === "household") {
    $("#view_title").textContent = "家庭采购与库存";
    $("#view_meta").textContent = "按周菜单分工采购 · 确认到货 · 按配餐消耗 · 库存同步预算与后续配餐";
    renderHousehold();
  } else if (mode === "meal") {
    $("#view_title").textContent = "家庭分餐协作";
    $("#view_meta").textContent = "家长确认份量 · 成员确认替换 · 采购负责人确认到货 · 按营养目标分餐，全程可追溯";
    renderMeal();
  } else if (mode === "day" && state.plan) { renderDayMeta(state.plan, state.plan.requirement); renderDay(state.plan, state.plan.requirement); }
  else if (mode === "week" && state.week) { renderWeek(state.week, state.week.requirement); }
  else { generate(); }
}

$$(".tab").forEach(t => {
  t.onclick = () => switchMode(t.dataset.mode);
});

$("#budget").oninput = () => { $("#budget_val").textContent = $("#budget").value + " 元"; };
$("#go").onclick = generate;
$("#to_household").onclick = async () => {
  await buildShoppingFromWeek();
  switchMode("household");
};

/* ===================== 家庭采购与库存 ===================== */

async function loadHousehold() {
  state.household = await api("/api/household");
  if (state.mode === "household") renderHousehold();
}

async function hhCall(path, body, method = "POST") {
  try {
    state.household = await api(path, method, body);
    renderHousehold();
    return true;
  } catch (e) {
    alert(e.message);
    return false;
  }
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderHousehold() {
  const h = state.household;
  if (!h) return;
  $("#hh_cycle_label").textContent = `第 ${h.state.cycle_no} 周`;
  renderWarnings(h);
  renderBudget(h);
  renderMembers(h);
  renderShopping(h);
  renderDays(h);
  renderStock(h);
}

  const el = $("#hh_warn");
  if (!h.warnings.length) {
    el.innerHTML = `<div class="banner good" style="margin-bottom:16px">✅ 无预算超支、缺料与过敏风险；库存与后续配餐已同步。</div>`;
    return;
  }
  el.innerHTML = `<div class="warn-list" style="margin-bottom:16px">${h.warnings.map(w => `
    <div class="warn-item ${w.level}"><span>${w.level === "danger" ? "⛔" : "⚠️"}</span><span>${esc(w.text)}</span></div>`).join("")}</div>`;
}

function renderBudget(h) {
  const b = h.budget;
  $("#hh_budget").innerHTML = `
    <div class="b-card"><div class="k">周预算</div><div class="v">¥${b.budget.toFixed(0)}</div></div>
    <div class="b-card"><div class="k">已采购支出</div><div class="v good">¥${b.spent.toFixed(1)}</div>

    <div class="b-card"><div class="k">预算余额</div><div class="v ${b.remaining < 0 ? "bad" : "good"}">${b.remaining < 0 ? "-" : ""}¥${Math.abs(b.remaining).toFixed(1)}</div></div>
    <div class="b-card"><div class="k">库存估值</div><div class="v">¥${h.inventory_value.toFixed(1)}</div></div>`;

function renderDays(h) {
  const el = $("#hh_days");
  if (!h.week || !h.week.plan) {
    el.innerHTML = `<div style="font-size:13px;color:#6b7d70">点击上方「按周菜单生成 / 刷新采购清单」后，可在此逐日确认到货食材的实际消耗。</div>`;
    return;
  }
  const stale = !!h.week_stale;
  /* 旧周菜单：从消耗记录还原该周已确认日序（可追溯），但禁止再次入账 */
  const doneDays = stale
    ? new Set((h.state.consumption || []).filter(l => l.source === "plan" && l.cycle === h.week.cycle && l.day_index != null).map(l => l.day_index))
    : new Set(h.consumed_days);
  const banner = stale
    ? `<div style="padding:10px 12px;margin-bottom:10px;border-radius:10px;background:#fff8ec;border:1px solid #f0dfc0;font-size:13px;color:#8a6d1a">该菜单属于第 ${h.week.cycle == null ? "?" : h.week.cycle} 采购周，当前已进入第 ${h.state.cycle_no} 周：以下记录仅供追溯，不能重复入账。请重新「按周菜单生成 / 刷新采购清单」后再确认消耗。</div>`
    : "";
  el.innerHTML = banner + h.week.plan.days.map((day, idx) => {
    const done = doneDays.has(idx);
    return `<div class="day-consume ${done ? "done" : ""}">
      <div class="info"><b>${day.day_name}</b><span>${day.items.length} 项 · 菜单 ¥${day.cost.toFixed(1)}${day.purchase_cost != null ? ` · 净采购 ¥${day.purchase_cost.toFixed(1)}` : ""}</span>${done ? '<span class="mini-tag ok">已消耗并扣库存</span>' : ""}</div>
      <button class="btn ${done || stale ? "ghost" : ""}" data-consume-day="${idx}" ${done || stale ? "disabled" : ""}>${done ? "已确认" : stale ? "已过期" : "确认当日消耗"}</button>
    </div>`;
  }).join("");
  if (!stale) $$("[data-consume-day]").forEach(b => b.onclick = () => hhCall(`/api/household/consume/day/${b.dataset.consume_day}`, {}));
}

function renderStock(h) {

      <td>${s.allergen_flag ? `<span class="mini-tag">含全家规避过敏原：${s.allergens.filter(a => h.family_allergens.includes(a)).join("、")}</span>` : '<span class="mini-tag ok">可用于配餐</span>'}</td>
    </tr>`).join("")}
  </table>` : `<div style="font-size:13px;color:#6b7d70">确认采购到货或录入期初库存后，这里会显示每种食材余量与估值。</div>`;

function modal(html) {

  root.querySelector("[data-close]") && (root.querySelector("[data-close]").onclick = closeModal);
  return root;
}
function closeModal() { $("#modal_root").innerHTML = ""; }

    <div class="field"><label>协作角色（分餐协作需要至少一名家长与一名采购负责人，可兼任）</label>
      <div class="chips" id="m_roles">
        <span class="chip ${(m0.roles || []).includes("parent") ? "on" : ""}" data-r="parent">👪 家长（确认份量）</span>

/* ===================== 家庭分餐协作 ===================== */

const MEAL_MEAL_LABEL = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };
let mealDayShown = 0;

async function mealCall(path, body) {
  try {
    state.household = await api(path, "POST", body);
    renderMeal();
    return true;
  } catch (e) {
    alert(e.message);
    return false;
  }
}

function currentActor(h) {
  h = h || state.household;
  if (!h || !h.state.members.length) return null;
  if (state.actorId != null && h.state.members.some(m => m.id === state.actorId)) {
    return h.state.members.find(m => m.id === state.actorId);
  }
  /* 默认以第一位家长身份操作 */
  const p = h.state.members.find(m => (m.roles || []).includes("parent")) || h.state.members[0];
  state.actorId = p.id;
  return p;
}

function renderMeal() {
  const h = state.household;
  const bar = $("#meal_actor_bar");
  const body = $("#meal_body");
  if (!h) return;
  if (!h.state.members.length) {
    bar.innerHTML = "";
    body.innerHTML = `<div class="banner bad">请先在「采购与库存」页添加家庭成员，并指定至少一名👪家长与一名🛒采购负责人。</div>`;
    return;
  }
  const actor = currentActor(h);
  bar.innerHTML = `
    <div class="hh-section" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:700">当前操作身份：</span>
      <select class="mini" id="meal_actor" style="padding:7px 10px">
        ${h.state.members.map(m => `<option value="${m.id}" ${m.id === actor.id ? "selected" : ""}>${esc(m.name)}${m.roles && m.roles.length ? "（" + m.roles.map(r => r === "parent" ? "家长" : "采购负责人").join("、") + "）" : "（成员）"}</option>`).join("")}
      </select>
      <span style="font-size:12px;color:var(--muted)">所有确认 / 替换 / 到货操作均以该身份留痕</span>
      <span style="flex:1"></span>
      <button class="btn" id="meal_build">🔄 ${h.meal ? "重新按营养目标生成分餐菜单" : "按成员营养目标生成分餐菜单"}</button>
    </div>`;
  $("#meal_actor").onchange = e => { state.actorId = Number(e.target.value); renderMeal(); };
  $("#meal_build").onclick = buildMeal;

  const m = h.meal;
  if (!m) {
    body.innerHTML = `<div class="banner good">家庭成员就绪后点击右上方按钮：系统将按每个人的营养目标（RNI 热量）分摊份量生成一周可追溯菜单，随后依次完成「家长确认份量 → 成员确认替换 → 采购负责人确认到货」。</div>`;
    return;
  }
  if (m.stale) {
    body.innerHTML = `<div class="banner bad">该分餐菜单属于第 ${m.cycle} 采购周，当前为第 ${h.state.cycle_no} 周：历史菜单与消耗记录保留可追溯，不能再确认或入账。请重新生成本周菜单。</div>` + renderMealTrace(h, m);
    return;
  }
  body.innerHTML = renderStages(h, m) + renderMealMembers(h, m) + renderMealDay(h, m) + renderMealShopping(h, m) + renderMealTrace(h, m);
  bindMealEvents(h, m);
}

function renderStages(h, m) {
  const steps = [
    { key: "portions", n: "阶段 1", t: "👪 家长确认份量", c: m.pending.portions ? `${m.pending.portions} 人待确认` : "全部已确认" },
    { key: "substitutions", n: "阶段 2", t: "🔁 成员确认替换", c: m.pending.substitutions ? `${m.pending.substitutions} 份待处理` : "全部已处理" },
    { key: "arrivals", n: "阶段 3", t: "🛒 采购确认到货", c: m.pending.arrivals ? `${m.pending.arrivals} 项待到货` : "全部已到货" },
  ];
  const idx = { portions: 0, substitutions: 1, arrivals: 2 }[m.stage];
  return `<div class="stage-bar">${steps.map((s, i) => `
    <div class="stage-step ${i < idx ? "done" : i === idx ? "cur" : ""}">
      <div class="n">${s.n}${i < idx ? " ✓" : ""}</div><div class="t">${s.t}</div><div class="c">${s.c}</div>
    </div>`).join("")}</div>`;
}

function renderMealMembers(h, m) {
  return `<div class="hh-section">
    <h3>👨‍👩‍👧 分餐成员与营养目标 <span class="count">基底人均 ${m.base_kcal} kcal · 全家合计 ${m.total_kcal} kcal/日</span></h3>
    <div class="member-grid">${m.members.map(mi => `
      <div class="member-card">
        <div class="nm">${esc(mi.name)}${(mi.roles || []).map(r => `<span class="role-badge ${r}">${r === "parent" ? "家长" : "采购"}</span>`).join("")}</div>
        <div class="pf">目标 ${mi.target_kcal} kcal/日 · 份额系数 ${mi.share}</div>
        <div class="ag">${(mi.allergens.length ? mi.allergens : ["无过敏原"]).map(a => `<span class="mini-tag ${a === "无过敏原" ? "ok" : ""}">${esc(a)}</span>`).join("")}</div>
        <div style="margin-top:6px">${mi.portion_confirmed ? '<span class="mini-tag ok">份量已确认</span>' : '<span class="mini-tag">份量待确认</span>'}</div>
      </div>`).join("")}</div>
  </div>`;
}

function pctCls2(p) { return p >= 85 && p <= 115 ? "good" : "warn"; }

function renderMealDay(h, m) {
  const day = m.days[mealDayShown];
  const adqKeys = ["kcal", "protein", "fiber", "calcium", "iron", "vitA", "vitC"];
  return `
  <div class="hh-section">
    <h3>🍱 按成员营养目标分餐 <span class="count">逐日查看每人份量、热量与营养达标度</span></h3>
    <div class="hh-toolbar">
      <select class="mini" id="meal_day_sel" style="padding:7px 10px">
        ${m.days.map((d, i) => `<option value="${i}" ${i === mealDayShown ? "selected" : ""}>${d.day_name}${d.consumed ? "（已消耗）" : ""}</option>`).join("")}
      </select>
      <span style="font-size:12px;color:var(--muted)">全家当日 ${Math.round(day.family_kcal)} kcal · 食材成本 ¥${day.family_cost.toFixed(1)}</span>
    </div>
    <div class="member-nutr" style="margin-bottom:14px">
      ${day.members.map(mm => `
        <div class="mn-card">
          <div class="h"><span>${esc(mm.name)}</span><span class="kcal-pill ${pctCls2(mm.kcal_pct)}">${Math.round(mm.kcal)} / ${mm.target_kcal} kcal · ${mm.kcal_pct}%</span></div>
          <div class="mini-adq" title="微量/宏量营养素达标度">
            ${adqKeys.map(k => { const p = mm.adequacy[k].pct; return `<i class="${p >= 80 ? "on" : p >= 60 ? "warn" : ""}" style="flex:1" title="${(meta.nutrient_labels[k]||k)} ${p}%"></i>`; }).join("")}
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:5px">蛋白 ${mm.adequacy.protein.pct}% · 钙 ${mm.adequacy.calcium.pct}% · 铁 ${mm.adequacy.iron.pct}% · 维C ${mm.adequacy.vitC.pct}% · ¥${mm.cost.toFixed(1)}</div>
        </div>`).join("")}
    </div>
    ${renderDishTable(h, m, day)}
    <div class="hh-toolbar" style="margin-top:12px">
      ${m.stage === "portions" ? portionToolbar(h, m) : ""}
      ${m.stage === "arrivals" && !day.consumed ? `<button class="btn" id="meal_consume_day">✅ 确认全家当日分餐消耗（按成员扣库存）</button>` : ""}
      ${day.consumed ? '<span class="mini-tag ok">该日已按成员份量消耗并入账</span>' : ""}
    </div>
  </div>`;
}

function renderDishTable(h, m, day) {
  const actor = currentActor(h);
  const dishes = m.dishes.filter(d => d.day === day.day);
  const head = `<div class="portion-row head"><span>菜品</span>${day.members.map(mm => `<span>${esc(mm.name)}</span>`).join("")}</div>`;
  const mealOrder = ["breakfast", "lunch", "dinner"];
  let html = head;
  for (const meal of mealOrder) {
    const ds = dishes.filter(d => d.meal === meal);
    if (!ds.length) continue;
    html += `<div style="margin:8px 0 2px;font-size:11px;font-weight:700;color:var(--brand-dark)">${MEAL_MEAL_LABEL[meal]}</div>`;
    for (const d of ds) {
      html += `<div class="portion-row">
        <span><span class="role-tag">${roleLabel(d.role)}</span>${esc(d.base_name)}${d.per.some(p => p.replaced) ? ' <span class="mini-tag ok">有替换</span>' : ""}</span>
        ${d.per.map(p => {
          const tag = { ok: '<span class="sub-tag ok">接受</span>', replaced: '<span class="sub-tag replaced">已替换</span>', pending: '<span class="sub-tag pending">待处理</span>' }[p.sub_status];
          const cell = m.stage === "portions"
            ? `<input type="number" step="1" min="1" data-portion-input="${d.id}:${p.member_id}" value="${p.grams}"> g`
            : `<b>${esc(p.food_name)}</b> ${p.grams}g`;
          const ops = m.stage === "substitutions" && (p.member_id === actor.id || (actor.roles || []).includes("parent"))
            ? ` <button class="icon-btn" data-sub="${d.id}" data-member="${p.member_id}">${p.sub_status === "pending" ? "替换/接受" : "修改"}</button>` : "";
          return `<div class="portion-cell"><div>${cell}${p.replaced ? `<div style="font-size:10.5px;color:#4154b5">↩ 原 ${esc(d.base_name)}</div>` : ""}${tag}</div>${ops}</div>`;
        }).join("")}
      </div>`;
    }
  }
  return html;
}

function portionToolbar(h, m) {
  const actor = currentActor(h);
  if (!(actor.roles || []).includes("parent")) {
    return `<span style="font-size:12px;color:var(--muted)">当前身份不是家长，请切换到家长身份确认份量（可先在表格中微调每位成员克重）。</span>`;
  }
  return m.members.filter(mm => !mm.portion_confirmed).map(mm =>
    `<button class="btn" data-confirm-portion="${mm.member_id}">👪 确认 ${esc(mm.name)} 的份量（含本页克重调整）</button>`).join("");
}

function renderMealShopping(h, m) {
  const items = h.shopping;
  const actor = currentActor(h);
  const canArrive = (actor.roles || []).includes("buyer") && m.stage === "arrivals";
  return `<div class="hh-section">
    <h3>🛒 采购清单与预算同步 <span class="count">按分餐净需求自动聚合（库存/待买抵扣 + 10% 余量）</span></h3>
    <div class="hh-budget" style="margin-bottom:12px">
      <div class="b-card"><div class="k">周预算</div><div class="v">¥${h.budget.budget.toFixed(0)}</div></div>
      <div class="b-card"><div class="k">已到货支出</div><div class="v good">¥${h.budget.spent.toFixed(1)}</div></div>
      <div class="b-card"><div class="k">待买占用</div><div class="v">¥${h.budget.committed.toFixed(1)}</div></div>
      <div class="b-card"><div class="k">预计总支出</div><div class="v ${h.budget.over ? "bad" : "good"}">¥${h.budget.projected.toFixed(1)}</div></div>
      <div class="b-card"><div class="k">预算余额</div><div class="v ${h.budget.remaining < 0 ? "bad" : "good"}">${h.budget.remaining < 0 ? "-" : ""}¥${Math.abs(h.budget.remaining).toFixed(1)}</div></div>
      <div class="b-card"><div class="k">库存估值</div><div class="v">¥${h.inventory_value.toFixed(1)}</div></div>
    </div>
    <table class="hh-table">
      <tr><th>状态</th><th>食材</th><th>数量</th><th>预估 / 实付</th><th>负责人</th>${m.stage === "arrivals" ? "<th>到货确认</th>" : ""}</tr>
      ${items.map(it => `<tr style="${it.allergen_flag ? "background:#fff7f6" : ""}">
        <td><span class="status-pill ${it.status}">${it.status === "pending" ? "待买" : "已到货"}</span></td>
        <td>${esc(it.name)}${it.source === "manual" ? ' <span class="mini-tag ok">手动</span>' : ""}</td>
        <td>${it.status === "arrived" ? `${it.arrived_grams}g（订${it.grams}g）` : `${it.grams}g`}</td>
        <td>¥${it.est_cost.toFixed(1)}${it.status === "arrived" ? ` / <b>¥${it.actual_cost.toFixed(1)}</b>` : ""}</td>
        <td>${esc(it.assignee_name || "未分配")}</td>
        ${m.stage === "arrivals" ? `<td>${it.status === "pending"
          ? (canArrive ? `<button class="icon-btn" data-meal-arrive="${it.id}">确认到货</button>` : '<span style="font-size:11px;color:var(--muted)">需采购负责人</span>')
          : '<span class="mini-tag ok">已入库</span>'}</td>` : ""}
      </tr>`).join("")}
    </table>
    ${m.stage !== "arrivals" ? '<div style="font-size:12px;color:var(--muted);margin-top:8px">替换确认全部完成后，进入到货阶段，采购负责人可逐项确认实际克重与单价。</div>' : ""}
  </div>`;
}

function renderMealTrace(h, m) {
  const trace = m.member_consumption.filter(x => x.entries > 0);
  return `<div class="hh-section">
    <h3>🧾 可追溯记录 <span class="count">份量调整 / 替换 / 到货 / 按成员消耗</span></h3>
    ${trace.length ? `<div style="margin-bottom:12px"><b style="font-size:13px">成员消耗台账：</b>
      <div class="member-grid" style="margin-top:8px">${trace.map(tc => `
        <div class="member-card"><div class="nm">${esc(tc.name)}</div>
          <div class="pf">${tc.entries} 条入账 · 共 ${tc.grams}g · 第 ${tc.days.map(d => d + 1).join("、")} 天</div></div>`).join("")}</div></div>` : ""}
    <div class="audit-box">
      ${m.audit.slice().reverse().slice(0, 60).map(a => `<div class="audit-item"><span class="at">${new Date(a.at).toLocaleString("zh-CN", { hour12: false })}</span>${esc(a.text)}</div>`).join("")}
    </div>
  </div>`;
}

function bindMealEvents(h, m) {
  const daySel = $("#meal_day_sel");
  if (daySel) daySel.onchange = () => { mealDayShown = Number(daySel.value); renderMeal(); };
  $$("[data-confirm-portion]").forEach(b => b.onclick = async () => {
    const memberId = Number(b.dataset.confirmPortion);
    const adjustments = [];
    $$("[data-portion-input]").forEach(inp => {
      const [dishId, mid] = inp.dataset.portionInput.split(":").map(Number);
      if (mid === memberId) adjustments.push({ dish_id: dishId, member_id: mid, grams: Number(inp.value) });
    });
    await mealCall("/api/household/meal/portions", { actor: currentActor(h).id, member_id: memberId, adjustments });
  });
  $$("[data-sub]").forEach(b => b.onclick = () => substitutionModal(h, m, Number(b.dataset.sub), Number(b.dataset.member)));
  $$("[data-meal-arrive]").forEach(b => b.onclick = () => mealArriveModal(h, Number(b.dataset.mealArrive)));
  const cd = $("#meal_consume_day");
  if (cd) cd.onclick = async () => {
    if (!confirm("确认全家当日分餐已食用？将按每位成员的确认份量扣减库存并入账（库存不足会给出缺料明细）。")) return;
    await mealCall(`/api/household/meal/consume/day/${mealDayShown}`, {});
  };
}

async function buildMeal() {
  try {
    state.household = await api("/api/household/meal/build", "POST", { exclude: [] });
    mealDayShown = 0;
    renderMeal();
  } catch (e) { alert("生成分餐菜单失败：" + e.message); }
}

async function substitutionModal(h, m, dishId, memberId) {
  const dish = m.dishes.find(d => d.id === dishId);
  const member = m.members.find(x => x.member_id === memberId);
  const cur = dish.per.find(p => p.member_id === memberId);
  let candidates = [];
  try {
    const r = await api(`/api/household/meal/dishes/${dishId}/candidates`, "POST", { actor: currentActor(h).id, member_id: memberId });
    candidates = r.candidates;
  } catch (e) { alert(e.message); return; }
  const root = modal(`
    <h3>${esc(member.name)} 的替换：${esc(dish.base_name)}（${MEAL_MEAL_LABEL[dish.meal]}）</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">当前：<b>${esc(cur.food_name)}</b> ${cur.grams}g。仅可替换为同类食材，含全家或个人过敏原、周限次已满的食材不会出现。</div>
    <div class="field"><label>替换为</label>
      <select id="sub_food" style="width:100%;padding:8px 10px">
        <option value="">保留原食材（${esc(dish.base_name)}）</option>
        ${candidates.map(c => `<option value="${c.food_id}">${esc(c.name)} · 净采购约 ¥${c.est_cost.toFixed(1)}${c.in_stock > 0 ? `（在库 ${c.in_stock}g 优先）` : ""}${c.allergens.length ? " · 含" + c.allergens.join("/") : ""}</option>`).join("")}
      </select></div>
    <div class="field"><label>替换后克重（留空沿用 ${cur.grams}g）</label><input id="sub_grams" type="number" min="1" step="1" class="mini" style="width:100%;padding:8px 10px" placeholder="${cur.grams}"></div>
    <div class="ops"><button class="btn cancel" data-close>取消</button><button class="btn" id="sub_save">确认</button></div>`);
  root.querySelector("#sub_save").onclick = async () => {
    const body = { actor: currentActor(h).id, dish_id: dishId, member_id: memberId };
    const fid = root.querySelector("#sub_food").value;
    if (fid) { body.food_id = fid; const g = root.querySelector("#sub_grams").value; if (g) body.grams = Number(g); }
    if (await mealCall("/api/household/meal/substitutions", body)) closeModal();
  };
}

function mealArriveModal(h, itemId) {
  const it = h.shopping.find(i => i.id === itemId);
  const f = state.foods.find(x => x.id === it.food_id);
  const root = modal(`
    <h3>采购确认到货：${esc(it.name)}</h3>
    <div class="field"><label>实际克重（毛重 g）</label><input class="mini" id="ma_grams" type="number" min="1" value="${it.grams}" style="width:100%;padding:8px 10px"></div>
    <div class="field"><label>实际单价（元 / 100g，留空按预估 ¥${f.cost}）</label><input class="mini" id="ma_cost" type="number" min="0" step="0.1" placeholder="按预估单价" style="width:100%;padding:8px 10px"></div>
    <div class="ops"><button class="btn cancel" data-close>取消</button><button class="btn" id="ma_save">确认入库</button></div>`);
  root.querySelector("#ma_save").onclick = async () => {
    const body = { actor: currentActor(h).id, grams: Number(root.querySelector("#ma_grams").value) };
    const uc = root.querySelector("#ma_cost").value;
    if (uc !== "") body.unit_cost = Number(uc);
    if (await mealCall(`/api/household/meal/shopping/${it.id}/arrive`, body)) closeModal();
  };
}

$("#hh_add_member").onclick = () => memberModal(null);
$("#hh_add_item").onclick = () => addItemModal();
$("#hh_add_stock").onclick = () => stockModal();
$("#hh_edit_budget").onclick = () => budgetModal();
$("#hh_build").onclick = buildShoppingFromWeek;
$("#hh_new_cycle").onclick = async () => {
  if (!confirm("开启新的采购周？未到货任务会结转、库存保留、周限次计数清零。")) return;
  await hhCall("/api/household/cycle", {});
};

(async () => {
  const m = await (await fetch("/api/meta")).json();
  initMeta(m);
  await loadFoods();
  state.foods = (await (await fetch("/api/foods")).json()).foods;
  await loadHousehold();
  generate();
})();
</script>
</body>
</html>
